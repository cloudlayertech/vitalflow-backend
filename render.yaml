services:
  - type: web
    name: vitalflow-api
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node src/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: vitalflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: FRONTEND_URL
        value: https://ambitious-meadow-053230410.7.azurestaticapps.net

databases:
  - name: vitalflow-db
    plan: free
    databaseName: vitalflow
    user: vitalflow_user
